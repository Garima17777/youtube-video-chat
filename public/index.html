<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
    ===========================================================================
    YouTube Video Chat - HTML Document
    ===========================================================================
    
    @description  Main HTML file for the YouTube Video Chat application.
                  Provides the structural markup for a chat interface that
                  allows users to ask AI-powered questions about YouTube videos.
    
    @author       Your Name
    @version      1.0.0
    @license      MIT
    
    @accessibility
    - Semantic HTML5 elements (header, main, section, etc.)
    - ARIA attributes for screen readers
    - Keyboard navigation support
    - Focus management
    
    @performance
    - External CSS loaded in head (render-blocking intentionally)
    - JavaScript loaded as module at end of body
    - Font preconnect for faster loading
    
    ===========================================================================
    -->
    
    <!-- Character encoding and viewport -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO and social meta tags -->
    <meta name="description" content="Chat with any YouTube video using AI. Fetch transcripts and ask questions about video content instantly." />
    <meta name="keywords" content="YouTube, AI, chat, transcript, video, OpenAI, GPT" />
    <meta name="author" content="Your Name" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#667eea" />
    
    <!-- Page title -->
    <title>YouTube Video Chat - AI-Powered Video Q&A</title>
    
    <!-- Preconnect to external resources for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts: Inter -->
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" 
      rel="stylesheet" 
    />
    
    <!-- External Libraries -->
    <!-- Marked.js: Markdown parser (converts AI responses to HTML) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- DOMPurify: HTML sanitizer (CRITICAL for XSS prevention) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  
  <body>
    <!--
    ===========================================================================
    MAIN APPLICATION CONTAINER
    ===========================================================================
    -->
    <div class="container">
      
      <!--
      =========================================================================
      HEADER
      Page title and tagline
      =========================================================================
      -->
      <header class="header">
        <h1 class="header__title">🎬 YouTube Video Chat</h1>
        <p class="header__subtitle">Ask questions about any YouTube video with AI</p>
      </header>
      
      <!--
      =========================================================================
      MAIN CONTENT
      =========================================================================
      -->
      <main>
        
        <!--
        =======================================================================
        CARD: Video URL Input
        Allows users to enter a YouTube URL to fetch its transcript
        =======================================================================
        -->
        <section class="card" aria-labelledby="video-input-heading">
          <h2 class="card__header" id="video-input-heading">
            📹 Enter YouTube Video URL
          </h2>
          <div class="card__body">
            <!-- Input group: URL field + Fetch button -->
            <div class="input-group">
              <input
                type="url"
                id="videoUrl"
                class="input"
                placeholder="https://www.youtube.com/watch?v=..."
                autocomplete="off"
                aria-label="YouTube video URL"
                aria-describedby="fetchStatus"
              />
              <button
                type="button"
                class="btn btn--primary"
                id="btnFetch"
                aria-label="Fetch video transcript"
              >
                Fetch Transcript
              </button>
            </div>
            
            <!-- Status message (success/error/info) -->
            <div
              id="fetchStatus"
              class="status"
              role="alert"
              aria-live="polite"
            ></div>
          </div>
        </section>
        
        <!--
        =======================================================================
        CARD: Chat Interface
        Displays chat history and allows asking questions
        =======================================================================
        -->
        <section class="card" aria-labelledby="chat-heading">
          <h2 class="card__header" id="chat-heading">
            💬 Chat with the Video
          </h2>
          <div class="card__body">
            
            <!-- Video info bar (shown when transcript is loaded) -->
            <div
              id="videoInfo"
              class="video-info"
              role="status"
              aria-live="polite"
            >
              <span class="video-info__badge" id="videoIdBadge">VIDEO</span>
              <span class="video-info__text" id="videoInfoText">Ready to chat!</span>
            </div>
            
            <!-- Clear chat button (hidden until there are messages) -->
            <button
              type="button"
              class="btn btn--clear hidden"
              id="btnClear"
              aria-label="Clear chat history"
            >
              🗑️ Clear Chat
            </button>
            
            <!-- Chat messages container -->
            <div
              class="chat-container"
              id="chatContainer"
              role="log"
              aria-live="polite"
              aria-label="Chat messages"
            >
              <!-- Empty state (shown when no messages) -->
              <div class="empty-chat">
                <div class="empty-chat__icon" aria-hidden="true">💭</div>
                <p>Fetch a video transcript to start chatting</p>
              </div>
            </div>
            
            <!-- Question input area -->
            <div class="question-input">
              <input
                type="text"
                id="question"
                class="input input--pill"
                placeholder="Ask a question about the video..."
                disabled
                autocomplete="off"
                aria-label="Your question about the video"
              />
              <button
                type="button"
                class="btn btn--secondary btn--pill"
                id="btnAsk"
                disabled
                aria-label="Send question"
              >
                Send
              </button>
            </div>
            
          </div>
        </section>
        
      </main>
      
    </div>
    
    <!-- Main JavaScript Application (loaded as ES module) -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
